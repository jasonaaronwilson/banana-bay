<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana Bay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #070b12;
      color: #ddd;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: min(98vw, calc(92vh * 4 / 3));
      height: min(92vh, calc(98vw * 3 / 4));
      image-rendering: pixelated;
      border: 2px solid #334455;
      background: #000;
      outline: none;
    }
    #hint {
      margin-top: 6px;
      font-size: 12px;
      color: #8899aa;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1024" height="768" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="hint">Click canvas to focus &amp; enable audio | WASD/Arrows: Move | Space/Z: Gun | X/Shift: Bomb | M: Mute</div>
  <script>
    var Module = {
      canvas: (function() {
        var c = document.getElementById('canvas');
        c.addEventListener('click', function() { c.focus(); });
        return c;
      })()
    };
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(function() {});
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
